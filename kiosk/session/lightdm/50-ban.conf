# Plan part 1, step 2.4: autologin of the POS user into the Ban session, no
# greeter. No -nocursor: unclutter hides the pointer on touch and when idle,
# so devices with a mouse stay usable.
[Seat:*]
autologin-user=adad
autologin-user-timeout=0
autologin-session=ban
user-session=ban
greeter-hide-users=true
allow-guest=false
xserver-command=X -nolisten tcp
