# Ban OS state directories (plan part 1, step 1.6). Created at every boot if
# missing, so they also appear on a fresh data partition. Owners are set to
# the service users when those exist (Stages 2 to 4).
d /var/lib/adad          0755 root root -
d /var/lib/adad/sync     0755 root root -
d /var/lib/adad/cache    0755 root root -
d /var/lib/adad/backups  0750 root root -
d /var/lib/ban           0755 root root -
d /var/lib/ban/backups   0750 root root -
d /var/lib/ban/outbox    0750 root root -
d /var/log/adad          0755 root root -
d /run/ban               0755 root root -
