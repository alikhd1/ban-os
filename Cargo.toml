[workspace]
resolver = "3"
members = [
    "agent/ban-agent",
    "event/ban-event",
    "crates/ban-api-types",
    # "center/ban-center/src-tauri",   # enabled in Stage 5 (BC-01)
]

# Shared metadata only. Versions are NOT shared: each component is versioned
# independently (see CONTRIBUTING.md, "Versions").
